# Publica o Ateliê no GitHub Pages a cada push na branch main (ou manualmente pela aba Actions).
# Pré-requisito único: Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # O site fica em https://<conta>.github.io/<repositório>/, exceto em repositórios "<conta>.github.io".
      - name: Definir caminho base
        run: |
          REPO="${{ github.event.repository.name }}"
          if [[ "$REPO" == *.github.io ]]; then BASE=""; else BASE="/$REPO"; fi
          echo "NEXT_PUBLIC_BASE_PATH=$BASE" >> "$GITHUB_ENV"
          echo "Caminho base: '${BASE:-/}'"

      - run: npm run typecheck

      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # Garante que o Pages não ignore a pasta _next/ (processamento Jekyll).
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
